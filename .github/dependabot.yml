version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    groups:
      site:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: monthly
    groups:
      infra:
        patterns: ['*']
